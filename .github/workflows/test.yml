# What this branch can run: the tests compiled against alfs_fs.h, with GCC
# and with Clang. The store (alfs_fs.c) is not written yet, so the suite,
# the soak and the Cortex-M0+ budgets cannot run; a release, which needs
# every test, is refused until it is. release.yml calls this workflow.
name: tests

on:
  push:
    branches: ['**']
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  tests-compile:
    name: tests compile against alfs_fs.h, no store code yet (${{ matrix.cc }})
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        cc: [gcc, clang]
    steps:
      - uses: actions/checkout@v4
      - run: make tests-compile CC=${{ matrix.cc }}

  release-gate:
    name: a release needs the store, to run every test
    if: github.ref_type == 'tag'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: test -f alfs_fs.c || { echo "alfs_fs.c is not written: the tests cannot run"; exit 1; }
